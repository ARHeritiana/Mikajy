name: Mikajy Spark signed release

# Two ways to release the version in android/AndroidManifest.xml:
#   - push a tag vX.Y (or vX.Y.Z) that matches it, or
#   - run this workflow from the Actions tab on main: it creates the tag vX.Y itself, on the commit it built.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Run mathematics, browser and unsigned Android checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  publish:
    name: Sign and publish Android APK
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the release tag from the Android version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("android/AndroidManifest.xml").getroot(); print(root.attrib["{http://schemas.android.com/apk/res/android}versionName"])')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual release is cut from main only, and never over an existing tag.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Run the release from main (this run is on $GITHUB_REF)"
              exit 1
            fi
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists: bump versionName/versionCode before releasing again"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match Android versionName $version"
              exit 1
            fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::Release tag must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH (got $tag)"
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install Android build and signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-21-jdk-headless aapt apksigner zipalign \
            android-sdk-platform-23 dalvik-exchange python3 unzip

      - name: Build, sign and verify with Mikajy's persistent release certificate
        shell: bash
        env:
          MIKAJY_KEYSTORE_B64: ${{ secrets.MIKAJY_KEYSTORE_B64 }}
          MIKAJY_ALIAS: ${{ secrets.MIKAJY_ALIAS }}
          MIKAJY_STOREPASS: ${{ secrets.MIKAJY_STOREPASS }}
          MIKAJY_KEYPASS: ${{ secrets.MIKAJY_KEYPASS }}
          MIKAJY_CERT_SHA256: ${{ vars.MIKAJY_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in MIKAJY_KEYSTORE_B64 MIKAJY_ALIAS MIKAJY_STOREPASS MIKAJY_KEYPASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name (configure environment 'release')"
              exit 1
            fi
          done

          export MIKAJY_KEYSTORE="$RUNNER_TEMP/mikajy-release.jks"
          trap 'rm -f "$MIKAJY_KEYSTORE"' EXIT
          (umask 077; printf '%s' "$MIKAJY_KEYSTORE_B64" | base64 --decode > "$MIKAJY_KEYSTORE")
          unset MIKAJY_KEYSTORE_B64
          ./build_apk.sh
          apksigner verify --verbose Mikajy.apk

          # The one-time Codespaces setup stores the new public SHA-256 fingerprint
          # as a protected release-environment variable. Refuse accidental key rotation.
          expected="$(printf '%s' "$MIKAJY_CERT_SHA256" |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Missing/invalid release environment variable MIKAJY_CERT_SHA256."
            exit 1
          fi
          actual="$(apksigner verify --print-certs Mikajy.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK certificate does not match the configured persistent signing key."
            exit 1
          fi
          echo "Verified Mikajy release-signing certificate."

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="Mikajy-Spark-${RELEASE_TAG#v}.apk"
          mv Mikajy.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt

      - name: Publish signed APK and checksum to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="Mikajy-Spark-${RELEASE_TAG#v}.apk"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target=(--target "$GITHUB_SHA")   # creates the tag on the commit that was built
          else
            target=(--verify-tag)             # the pushed tag must already exist
          fi
          gh release create "$RELEASE_TAG" "$apk" SHA256SUMS.txt \
            "${target[@]}" --generate-notes --title "Mikajy Spark ${RELEASE_TAG#v}"
