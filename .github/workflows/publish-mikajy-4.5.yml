name: Publish Mikajy 4.5 APK
on:
  push:
    paths:
      - '.github/workflows/publish-mikajy-4.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore and verify the exact signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/d4e3de421a718d1940fbf3658998ef32901c3e50" --jq '.content' |
            tr -d '\n' | base64 --decode > Mikajy-4.5.apk
          echo 'a3cb4e0c7fc63c718c37a61f6ad4718021e7d9466331a136b1e2b585be1c433e  Mikajy-4.5.apk' | sha256sum --check
      - name: Publish v4.5 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v4.5 >/dev/null 2>&1; then
            gh release upload v4.5 Mikajy-4.5.apk --clobber
          else
            gh release create v4.5 Mikajy-4.5.apk \
              --target 565a56af4728133294b152c436fcb56fde7068e6 \
              --title "Mikajy 4.5" \
              --notes "Signed Android APK for Mikajy 4.5 (com.mikajy.app, versionCode 14). Built from the 4.5 source and verified against the uploaded signed package."
          fi
