name: MathNote OCR pretrained prototype
on:
  push:
    branches: [experiment/mathnote-pretrained-20261110]
    paths:
      - "experiments/mathnote/**"
      - ".github/workflows/mathnote-prototype.yml"
  pull_request:
    paths:
      - "experiments/mathnote/**"
      - ".github/workflows/mathnote-prototype.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test incremental bridge and browser syntax
        run: |
          python -m unittest discover -s experiments/mathnote/tests -v
          python -m py_compile experiments/mathnote/server.py experiments/mathnote/smoke_model.py
          node --check experiments/mathnote/app.js
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install real MathNote OCR and bundled weights
        run: python -m pip install --no-cache-dir -r experiments/mathnote/requirements.txt
      - name: Run actual pretrained model smoke test
        run: python experiments/mathnote/smoke_model.py
